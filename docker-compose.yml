services:
  postgres:
    image: postgres:18-bookworm
    container_name: postgres_db
    volumes:
      - ${PROJECT_ROOT}/pgdata:/var/lib/postgresql/
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - ${PROJECT_ROOT}/.env
    ports:
      - "5432:5432"
